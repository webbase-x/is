.mouth{position:absolute;left:50%;bottom:0;width:14px;height:7px;transform:translateX(-50%);border-bottom:2px solid #cc746b;border-radius:0 0 12px 12px}
#topbar{position:absolute;left:12px;right:12px;top:var(--safe-top);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:20;pointer-events:none}
.hud{background:var(--hud);border:1px solid var(--stroke);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;color:#fff;padding:10px 14px;box-shadow:0 10px 28px rgba(0,0,0,.2);pointer-events:auto}
#titleBox b{display:block;font-size:16px} #titleBox span{opacity:.86;font-size:11px;letter-spacing:.06em}
#stateBox{display:flex;align-items:center;gap:9px;padding:10px 13px;font-weight:750}
.dot{width:10px;height:10px;border-radius:50%;background:#7bd58c;box-shadow:0 0 10px rgba(123,213,140,.7)}
#bottomHud{position:absolute;left:12px;right:12px;bottom:calc(106px + var(--safe-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:10px;z-index:18;pointer-events:none}
#help{padding:8px 12px;font-size:12px;opacity:.95} #meter{padding:10px 12px;min-width:132px}
#meterLabel{display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.9;margin-bottom:8px}
#meterTrack{height:8px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
#meterFill{height:100%;width:0%;background:linear-gradient(90deg,#7bc4ff,#18e0db);border-radius:999px;transition:width .08s linear}
#controls{position:absolute;left:10px;right:10px;bottom:var(--safe-bottom);z-index:25;display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;align-items:end}
.controlCard{background:rgba(8,24,40,.62);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:10px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.dirRow,.actRow{display:flex;gap:8px}
.ctrl{flex:1;min-height:66px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);font-weight:800}
.ctrl span{font-size:25px;line-height:1} .ctrl small{font-size:11px;opacity:.95} .ctrl.active,.ctrl:active{transform:translateY(2px);background:linear-gradient(180deg,rgba(34,205,219,.46),rgba(19,115,136,.44))}
#runHold{min-height:94px;border-radius:22px;background:linear-gradient(180deg,#24d9d6,#0e8bc0);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 22px rgba(8,78,105,.33);font-weight:900;letter-spacing:.04em}
#runHold .big{font-size:30px;line-height:1} #runHold .sub{font-size:11px;opacity:.95} #runHold.active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 5px 13px rgba(8,78,105,.26);filter:saturate(1.15)}
#overlay{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:linear-gradient(180deg,rgba(2,18,31,.42),rgba(2,18,31,.72));backdrop-filter:blur(2px)}
.card{width:min(390px,90vw);background:linear-gradient(180deg,rgba(254,255,255,.97),rgba(235,246,252,.97));color:#08324a;border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.28);text-align:center}
.card .tag{display:inline-block;font-weight:900;font-size:11px;color:#0ba1b0;letter-spacing:.12em}.card h1{margin:8px 0 10px;font-size:28px;line-height:1.25}.card p{margin:0;color:#446677;line-height:1.65;font-size:14px}
#startBtn{margin-top:18px;width:100%;padding:16px 18px;border-radius:18px;background:linear-gradient(180deg,#1bd2d7,#0d8dbb);color:#fff;font-weight:900;font-size:18px;box-shadow:0 7px 0 rgba(12,117,149,.95)}
#startBtn:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(12,117,149,.95)}
#pauseBtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:22px}
.hide{display:none !important}
#announce{position:absolute;left:50%;top:calc(var(--safe-top) + 74px);transform:translateX(-50%);z-index:26;background:rgba(5,21,35,.62);backdrop-filter:blur(12px);padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:700;opacity:0;transition:opacity .2s}
#announce.show{opacity:1}
@media (min-aspect-ratio: 1/1){#scene{height:100vh;width:min(56vh,560px)}}
</style>
</head>
<body>
<div id="app">
  <div id="sceneWrap"><div id="scene">
    <div id="bg"></div>
    <div id="laneDashes"><div class="dashCol"></div><div class="dashCol"></div></div>
    <div id="runner" class="shadowing"><div id="rig">
      <div id="backpack"></div>
      <div id="legL" class="limb leg upper sideL"><div class="leg fore"><div class="sock"></div><div class="shoe"></div></div></div>
      <div id="legR" class="limb leg upper sideR"><div class="leg fore"><div class="sock"></div><div class="shoe"></div></div></div>
      <div id="torso"></div><div id="shirtTie"></div><div id="neck"></div>
      <div id="armL" class="limb arm upper"><div class="arm fore"><div class="hand"></div></div></div>
      <div id="armR" class="limb arm upper"><div class="arm fore"><div class="hand"></div></div></div>
      <div id="head"></div><div id="hair"></div><div id="face"><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div></div>
    </div></div>
    <div id="roadMask"></div>
  </div></div>
  <div id="topbar">
    <div id="titleBox" class="hud"><b>BOYANG RUN · 2.5D</b><span>ถนนนครนอก · หน้าโรงเรียนเทศบาล ๑</span></div>
    <div style="display:flex;gap:8px;align-items:flex-start"><div id="stateBox" class="hud"><div class="dot" id="stateDot"></div><div id="stateText">พร้อมเล่น</div></div><button id="pauseBtn" class="hud" aria-label="หยุดเกม">Ⅱ</button></div>
  </div>
  <div id="announce">เริ่มได้เลย</div>
  <div id="bottomHud"><div id="help" class="hud">กดค้าง <b>RUN</b> = วิ่ง · ปล่อย = เดิน · ปัด/กดปุ่มเพื่อบังคับ</div><div id="meter" class="hud"><div id="meterLabel"><span>พลังการเคลื่อนไหว</span><b id="speedLabel">เดิน</b></div><div id="meterTrack"><div id="meterFill"></div></div></div></div>
  <div id="controls"><div class="controlCard"><div class="dirRow"><button class="ctrl" id="leftBtn"><span>◀</span><small>ซ้าย</small></button><button class="ctrl" id="rightBtn"><span>▶</span><small>ขวา</small></button></div></div><div class="controlCard"><button id="runHold"><div class="big">RUN</div><div class="sub">กดค้างเพื่อวิ่ง</div></button></div><div class="controlCard"><div class="actRow"><button class="ctrl" id="jumpBtn"><span>⬆</span><small>กระโดด</small></button><button class="ctrl" id="slideBtn"><span>⬇</span><small>สไลด์</small></button></div></div></div>
  <div id="overlay"><div class="card"><div class="tag">PROTOTYPE · PROFESSIONAL CONTROL</div><h1>บ่อยางรัน</h1><p>ต้นแบบเกม 2.5D บนถนนนครนอก<br>กดค้างปุ่ม <b>RUN</b> เพื่อวิ่งจริง ปล่อยเพื่อเดิน<br>พร้อมท่ากระโดดและสไลด์</p><button id="startBtn">▶ เริ่มเล่น</button></div></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const state={started:false,paused:false,lane:0,laneX:0,targetLaneX:0,runPressed:false,mode:'idle',jumpT:0,slideT:0,announceTimer:null,last:performance.now(),dashOffset:0,cameraBob:0};
const els={scene:$('#scene'),bg:$('#bg'),runner:$('#runner'),rig:$('#rig'),overlay:$('#overlay'),pauseBtn:$('#pauseBtn'),stateText:$('#stateText'),announce:$('#announce'),meterFill:$('#meterFill'),speedLabel:$('#speedLabel'),runHold:$('#runHold'),leftBtn:$('#leftBtn'),rightBtn:$('#rightBtn'),jumpBtn:$('#jumpBtn'),slideBtn:$('#slideBtn'),stateDot:$('#stateDot')};
const arms={L:$('#armL'),R:$('#armR')}, legs={L:$('#legL'),R:$('#legR')}, forearms={L:$('#armL .fore'),R:$('#armR .fore')}, forelegs={L:$('#legL .fore'),R:$('#legR .fore')};
const laneWidth=88;
function showMsg(txt){els.announce.textContent=txt;els.announce.classList.add('show');clearTimeout(state.announceTimer);state.announceTimer=setTimeout(()=>els.announce.classList.remove('show'),1200)}
function setStatus(txt,color='#7bd58c'){els.stateText.textContent=txt;els.stateDot.style.background=color;els.stateDot.style.boxShadow='0 0 10px '+color}
function labelForMode(){return state.mode==='run'?'กำลังวิ่ง':state.mode==='walk'?'กำลังเดิน':state.mode==='jump'?'กำลังกระโดด':state.mode==='slide'?'กำลังสไลด์':'พร้อมเล่น'}
function colorForMode(){return state.mode==='run'?'#7cf3b2':state.mode==='walk'?'#79d0ff':state.mode==='jump'?'#ffd86b':state.mode==='slide'?'#ffb071':'#7bd58c'}
function updateMeter(){const v=state.mode==='run'?100:state.mode==='walk'?44:state.mode==='jump'?78:state.mode==='slide'?68:0;els.meterFill.style.width=v+'%';els.speedLabel.textContent=state.mode==='run'?'วิ่ง':state.mode==='walk'?'เดิน':state.mode==='jump'?'กระโดด':state.mode==='slide'?'สไลด์':'หยุด';setStatus(labelForMode(),colorForMode())}
function start(){state.started=true;state.paused=false;state.mode='walk';state.runPressed=false;state.jumpT=0;state.slideT=0;els.overlay.classList.add('hide');updateMeter();showMsg('เริ่มเดินสำรวจ')}
function togglePause(){if(!state.started)return;state.paused=!state.paused;els.pauseBtn.textContent=state.paused?'▶':'Ⅱ';setStatus(state.paused?'หยุดชั่วคราว':labelForMode(),state.paused?'#ffca73':colorForMode());if(!state.paused)state.last=performance.now()}
function setRunHold(on){if(!state.started||state.paused)return;state.runPressed=on;if(state.jumpT>0||state.slideT>0)return;state.mode=on?'run':'walk';els.runHold.classList.toggle('active',on);updateMeter();if(on)showMsg('วิ่ง!')}
function lane(dir){if(!state.started||state.paused)return;state.lane=Math.max(-1,Math.min(1,state.lane+dir));state.targetLaneX=state.lane*laneWidth;showMsg(state.lane===0?'กลาง':state.lane<0?'ซ้าย':'ขวา')}
function jump(){if(!state.started||state.paused||state.jumpT>0||state.slideT>0)return;state.jumpT=.001;state.mode='jump';updateMeter();showMsg('กระโดด!')}
function slide(){if(!state.started||state.paused||state.jumpT>0||state.slideT>0)return;state.slideT=.001;state.mode='slide';updateMeter();showMsg('สไลด์!')}
function bindTap(el,fn){el.addEventListener('click',e=>{e.preventDefault();fn()},{passive:false})}
bindTap($('#startBtn'),start);bindTap(els.pauseBtn,togglePause);bindTap(els.leftBtn,()=>lane(-1));bindTap(els.rightBtn,()=>lane(1));bindTap(els.jumpBtn,jump);bindTap(els.slideBtn,slide);
['pointerdown','touchstart','mousedown'].forEach(ev=>els.runHold.addEventListener(ev,e=>{e.preventDefault();setRunHold(true)},{passive:false}));
['pointerup','pointercancel','pointerleave','touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>els.runHold.addEventListener(ev,e=>{e.preventDefault();setRunHold(false)},{passive:false}));
let swipe=null;els.scene.addEventListener('pointerdown',e=>{swipe={x:e.clientX,y:e.clientY}},{passive:true});els.scene.addEventListener('pointerup',e=>{if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dx)>Math.abs(dy))lane(dx>0?1:-1);else dy<0?jump():slide()},{passive:true});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','Shift','p','Escape'].includes(e.key))e.preventDefault();if(!state.started){if(e.key==='Enter'||e.key===' ')start();return;}switch(e.key){case 'ArrowLeft':case 'a':lane(-1);break;case 'ArrowRight':case 'd':lane(1);break;case 'ArrowUp':case 'w':jump();break;case 'ArrowDown':case 's':slide();break;case 'Shift':case ' ':setRunHold(true);break;case 'p':case 'Escape':togglePause();break;}},{passive:false});
window.addEventListener('keyup',e=>{if(['Shift',' '].includes(e.key))setRunHold(false)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.started&&!state.paused)togglePause()});
function animate(ts){requestAnimationFrame(animate);const dt=Math.min(.04,(ts-state.last)/1000||0);state.last=ts;if(!state.started||state.paused)return;state.laneX+=(state.targetLaneX-state.laneX)*Math.min(1,dt*8.8);const movingMode=(state.jumpT>0)?'jump':(state.slideT>0)?'slide':(state.runPressed?'run':'walk');if(state.jumpT<=0&&state.slideT<=0&&state.mode!==movingMode){state.mode=movingMode;updateMeter()}
const speed=state.mode==='run'?1:state.mode==='walk'?.45:state.mode==='jump'?.95:state.mode==='slide'?.72:0;state.dashOffset=(state.dashOffset+dt*speed*560)%80;$$('.dashCol').forEach(el=>el.style.backgroundPosition='center '+state.dashOffset+'px');state.cameraBob+=dt*(state.mode==='run'?7.6:state.mode==='walk'?4.1:2.6);let bob=Math.sin(state.cameraBob)*(state.mode==='run'?7:state.mode==='walk'?3.5:1.5);let zoom=1.017+(state.mode==='run'?0.016:state.mode==='walk'?0.006:0.01);els.bg.style.transform='translate3d('+(-state.laneX*0.08)+'px,'+(bob*0.35)+'px,0) scale('+zoom+')';
let jumpY=0,slideSquash=1,rigRot=0,runnerScaleX=1,runnerScaleY=1;if(state.jumpT>0){state.jumpT+=dt/0.72;const p=Math.min(1,state.jumpT);jumpY=-Math.sin(Math.PI*p)*118;runnerScaleY=1+Math.sin(Math.PI*p)*0.04;rigRot=Math.sin(Math.PI*p)*4;if(p>=1){state.jumpT=0;state.mode=state.runPressed?'run':'walk';updateMeter()}} if(state.slideT>0){state.slideT+=dt/0.58;const p=Math.min(1,state.slideT),ease=Math.sin(Math.PI*p);jumpY=26*ease;runnerScaleY=1-0.28*ease;runnerScaleX=1+0.12*ease;rigRot=-12*ease;slideSquash=1-0.4*ease;if(p>=1){state.slideT=0;state.mode=state.runPressed?'run':'walk';updateMeter()}}
const phase=state.cameraBob,ampA=state.mode==='run'?38:state.mode==='walk'?18:10,ampL=state.mode==='run'?34:state.mode==='walk'?16:9;let armL=Math.sin(phase)*ampA,armR=-Math.sin(phase)*ampA,legL=-Math.sin(phase)*ampL,legR=Math.sin(phase)*ampL,foreAL=Math.max(0,-Math.sin(phase))*38,foreAR=Math.max(0,Math.sin(phase))*38,foreLL=Math.max(0,Math.sin(phase))*25,foreLR=Math.max(0,-Math.sin(phase))*25;if(state.jumpT>0){armL=-28;armR=22;legL=18;legR=22;foreAL=14;foreAR=10;foreLL=20;foreLR=18} if(state.slideT>0){armL=56;armR=-18;legL=84;legR=76;foreAL=18;foreAR=10;foreLL=10;foreLR=8}
arms.L.style.transform='rotate('+armL+'deg)';arms.R.style.transform='rotate('+armR+'deg)';forearms.L.style.transform='rotate('+foreAL+'deg)';forearms.R.style.transform='rotate('+foreAR+'deg)';legs.L.style.transform='rotate('+legL+'deg)';legs.R.style.transform='rotate('+legR+'deg)';forelegs.L.style.transform='rotate('+foreLL+'deg)';forelegs.R.style.transform='rotate('+foreLR+'deg)';els.runner.style.transform='translateX(calc(-50% + '+state.laneX+'px)) translateY('+jumpY+'px) scaleX('+runnerScaleX+') scaleY('+runnerScaleY+')';els.rig.style.transform='rotate('+rigRot+'deg) scaleY('+slideSquash+')';}
requestAnimationFrame(animate);
})();
</script>
</body>
</html>
