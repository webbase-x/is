#bg1{opacity:0}
#roadCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#runnerShadow{position:absolute;bottom:11.9%;left:50%;width:30%;height:3.3%;border-radius:50%;background:#00182c75;filter:blur(11px);transform:translateX(-50%);pointer-events:none;will-change:transform,opacity}
#runner{position:absolute;bottom:13%;left:50%;height:37%;width:auto;max-width:68%;object-fit:contain;object-position:50% 100%;pointer-events:none;filter:drop-shadow(0 9px 5px #102c3d55);transform-origin:50% 93%;will-change:transform}
#hud{position:absolute;left:12px;right:12px;top:max(13px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:start;gap:8px;z-index:10;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 22px #0004;color:#fff;pointer-events:auto}
#title{padding:10px 13px} #title b{font-size:14px;display:block}#title small{font-size:10px;color:#e4f4ff}#rightHud{display:flex;gap:7px;align-items:center}#speed{padding:10px;font-weight:750;font-size:11px;white-space:nowrap}#pause{width:43px;height:43px;font-size:20px;font-weight:900}
#distance{position:absolute;left:12px;top:calc(max(13px,env(safe-area-inset-top)) + 60px);padding:7px 11px;font-size:11px;font-weight:800;z-index:12}
#notice{position:absolute;top:calc(max(13px,env(safe-area-inset-top)) + 100px);left:50%;transform:translateX(-50%);color:white;background:#08243abf;padding:8px 16px;border:1px solid #ffffff44;border-radius:999px;font-size:12px;font-weight:700;opacity:0;z-index:13;transition:opacity .2s;white-space:nowrap}
#notice.show{opacity:1}
#toolbar{position:absolute;left:9px;right:9px;bottom:max(12px,env(safe-area-inset-bottom));z-index:20;display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end}
.ctrlgroup{display:flex;gap:6px;padding:7px;border:1px solid var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.action{flex:1;min-height:66px;min-width:0;border:1px solid #ffffff50;border-radius:15px;background:linear-gradient(#ffffff51,#ffffff1b);font-size:11px;font-weight:750;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;box-shadow:inset 0 1px #ffffff72}
.action b{font-size:23px;line-height:1.1} .action.down,.action:active{background:linear-gradient(#14e5e0b8,#0c79b7b8);transform:translateY(2px)}
#run{height:84px;min-width:0;border-radius:22px;background:linear-gradient(145deg,#13d1cf,#057eb5);box-shadow:inset 0 1px #ffffff80,0 7px #065d83,0 12px 25px #031927a8;border:1px solid #91f1fa;display:grid;align-content:center;justify-items:center;gap:3px;letter-spacing:.04em}
#run strong{font-size:25px;line-height:1}#run small{font-size:10px}#run.down{transform:translateY(5px);box-shadow:inset 0 1px #ffffff80,0 2px #065d83,0 6px 12px #031927a8}
#settings{position:absolute;left:12px;right:12px;bottom:calc(108px + max(12px,env(safe-area-inset-bottom)));display:flex;justify-content:space-between;gap:5px;z-index:12;pointer-events:none}#release{padding:7px 10px;font-size:10px;pointer-events:auto}#hint{padding:7px 9px;font-size:10px;opacity:.88;text-align:right}
#modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#021725a8;backdrop-filter:blur(3px);padding:17px}
#modal.hide{display:none}

const s={active:false,paused:false,run:false,release:'walk',speed:0,dist:0,last:performance.now(),phase:0,lane:0,laneX:0,targetX:0,jump:-1,slide:-1,swipe:null,pose:'idle',poseFrame:-1,motion:0};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));const smooth=(t)=>t*t*(3-2*t);let msgT=0;
function announce(t){$('notice').textContent=t;$('notice').classList.add('show');clearTimeout(msgT);msgT=setTimeout(()=>$('notice').classList.remove('show'),1200)}
function mode(){return s.jump>=0?'jump':s.slide>=0?'slide':s.run?'run':s.release==='walk'?'walk':'idle'}
function syncStatus(){const m=mode();$('speed').textContent=({idle:'● หยุด',walk:'● เดิน',run:'● วิ่ง',jump:'↑ กระโดด',slide:'↓ สไลด์'})[m]||m;}
function begin(){s.active=true;s.paused=false;s.speed=0;s.run=false;s.last=performance.now();$('run').classList.remove('down');$('modal').classList.add('hide');syncStatus();announce('เริ่มสำรวจ')}
function togglePause(){if(!s.active)return;s.paused=!s.paused;setRun(false);$('heading').textContent='หยุดพัก';$('description').textContent='พร้อมแล้วกลับไปเดินทางบนถนนนครนอกต่อ';$('start').textContent='▶ เล่นต่อ';$('modal').classList.toggle('hide',!s.paused);$('pause').textContent=s.paused?'▶':'Ⅱ';s.last=performance.now()}
function setRun(v){if(!s.active||s.paused){s.run=false;return;}s.run=v;$('run').classList.toggle('down',v);syncStatus()}
function lane(k){if(!s.active||s.paused)return;s.lane=clamp(s.lane+k,-1,1);s.targetX=s.lane;announce(s.lane<0?'เปลี่ยนเลนซ้าย':s.lane>0?'เปลี่ยนเลนขวา':'เลนกลาง')}
function jump(){if(!s.active||s.paused||s.jump>=0||s.slide>=0)return;s.jump=0;syncStatus();announce('กระโดด')}
function slide(){if(!s.active||s.paused||s.jump>=0||s.slide>=0)return;s.slide=0;syncStatus();announce('สไลด์')}
$('start').addEventListener('click',()=>{if(s.active&&s.paused){s.paused=false;$('modal').classList.add('hide');$('pause').textContent='Ⅱ';s.last=performance.now();syncStatus()}else begin()});
$('pause').addEventListener('click',togglePause);
$('release').addEventListener('click',()=>{s.release=s.release==='walk'?'idle':'walk';$('release').textContent=s.release==='walk'?'ปล่อย = เดิน':'ปล่อย = หยุด';syncStatus()});
$('left').addEventListener('click',()=>lane(-1));$('right').addEventListener('click',()=>lane(1));$('jump').addEventListener('click',jump);$('slide').addEventListener('click',slide);
const run=$('run');run.addEventListener('pointerdown',e=>{e.preventDefault();try{run.setPointerCapture(e.pointerId)}catch(_){}setRun(true)});
for(const ev of ['pointerup','pointercancel','lostpointercapture','pointerleave'])run.addEventListener(ev,()=>setRun(false));
window.addEventListener('blur',()=>setRun(false));document.addEventListener('visibilitychange',()=>{if(document.hidden){setRun(false);if(s.active&&!s.paused)togglePause()}});
w.addEventListener('pointerdown',e=>{s.swipe={x:e.clientX,y:e.clientY,id:e.pointerId}});
w.addEventListener('pointerup',e=>{if(!s.swipe||e.pointerId!==s.swipe.id)return;const dx=e.clientX-s.swipe.x,dy=e.clientY-s.swipe.y;s.swipe=null;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dx)>Math.abs(dy))lane(dx>0?1:-1);else if(dy<0)jump();else slide()});
const keys=new Set();window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Shift','a','d','w','s','Escape'].includes(e.key))e.preventDefault();if(!s.active&&['Enter',' '].includes(e.key)){$('start').click();return;}if(e.repeat)return;keys.add(e.key.toLowerCase());if(['ArrowLeft','a'].includes(e.key))lane(-1);else if(['ArrowRight','d'].includes(e.key))lane(1);else if(['ArrowUp','w'].includes(e.key))jump();else if(['ArrowDown','s'].includes(e.key))slide();else if([' ','Shift'].includes(e.key))setRun(true);else if(e.key==='Escape')togglePause()},{passive:false});
window.addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if([' ','Shift'].includes(e.key))setRun(false)});
function resize(){const r=w.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);cvs.width=Math.round(r.width*dpr);cvs.height=Math.round(r.height*dpr);c.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();
function drawRoad(){if(!roadTex.complete||!roadTex.naturalWidth)return;const W=w.clientWidth,H=w.clientHeight,hy=H*.46; c.clearRect(0,0,W,H);if(s.speed<.12)return;
 // Project an asphalt texture across a moving perspective road, with no game objects.
 for(let y=Math.floor(hy);y<H;y+=4){const t=(y-hy)/(H-hy),z=1/(.12+t*.9),half=W*(.046+.73*Math.pow(t,1.13)),x=W/2-half;const ty=((s.dist*16+z*58)%roadTex.height+roadTex.height)%roadTex.height; c.globalAlpha=.11*Math.pow(t,.40);c.drawImage(roadTex,0,Math.floor(ty),roadTex.width,2,x,y,half*2,5);}
 c.globalAlpha=1;
 // Dashes pass under the player, becoming longer and wider in the foreground.
 const cycle=(s.dist*3)%18;for(let k=-1;k<18;k++){let z=k*18-cycle;if(z<0||z>205)continue;const t=1/(1+z*.058),y=hy+(H-hy)*t;const len=clamp(38*t,3,38),ww=clamp(5*t,1.5,6);for(const side of [-1,1]){const mx=W/2+side*(W*.045+W*.29*Math.pow(t,1.18));c.globalAlpha=.18+.68*t;c.fillStyle='#f3f1e7';c.beginPath();c.moveTo(mx-ww,y-len);c.lineTo(mx+ww,y-len);c.lineTo(mx+ww*1.25,y);c.lineTo(mx-ww*1.25,y);c.closePath();c.fill()}}
 c.globalAlpha=1;}
function updateVisual(){const W=w.clientWidth,H=w.clientHeight; // 9-second repeating moving camera cycle, actual visual progress not 1% zoom.
 const cycleDistance=42,pass=s.dist/cycleDistance,t=pass%1,blend=clamp((t-.75)/.25,0,1);const zoomA=1.02+.42*t,zoomB=1.02+.42*((t+.25)%1);const vertA=H*(.022*t),vertB=H*(.022*((t+.25)%1));
 a.style.transform=`translate3d(${-s.laneX*W*.032}px,${vertA}px,0) scale(${zoomA})`;
 b.style.transform=`translate3d(${-s.laneX*W*.032}px,${vertB}px,0) scale(${zoomB})`;b.style.opacity=blend;
 const jumpHeight=s.jump>=0?Math.sin(Math.PI*clamp(s.jump/.78,0,1)):0;const slideT=s.slide>=0?Math.sin(Math.PI*clamp(s.slide/.65,0,1)):0;const feetBob=(mode()==='run'?7:mode()==='walk'?3:0)*Math.abs(Math.sin(s.phase));
 let pose=mode(),id='idle',flip=false; if(pose==='walk'||pose==='run'){id=(s.poseFrame%2===0)?pose:(pose==='walk'?'run':'walk');flip=s.poseFrame%2===1;}else if(pose==='jump')id='jump';else if(pose==='slide')id='slide';
 if(id!==s.pose){character.src=poses[id];s.pose=id;}
 const x=s.laneX*W*.17,y=-feetBob-jumpHeight*H*.13+slideT*H*.08;
 const sx=flip?-1:1,sy=1-slideT*.16;
 character.style.transform=`translate3d(calc(-50% + ${x}px),${y}px,0) scale(${sx},${sy}) rotate(${s.laneX*1.7}deg)`;
 $('runnerShadow').style.transform=`translateX(calc(-50% + ${x}px)) scale(${1-jumpHeight*.40})`;$('runnerShadow').style.opacity=String(1-jumpHeight*.6);
}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,Math.max(0,(now-s.last)/1000));s.last=now;if(!s.active||s.paused)return;
 s.speed+=( (s.run?7.0:s.release==='walk'?2.6:0)-s.speed )*(1-Math.exp(-dt*7));s.dist+=s.speed*dt;s.motion+=dt*s.speed;s.phase+=dt*s.speed*(s.run?2.35:2.55);s.laneX+=(s.targetX-s.laneX)*(1-Math.exp(-dt*9));
 s.poseFrame=Math.floor(s.phase/1.3);if(s.jump>=0){s.jump+=dt;if(s.jump>=.78)s.jump=-1;}if(s.slide>=0){s.slide+=dt;if(s.slide>=.65)s.slide=-1;}
 $('distance').textContent='ระยะในเกม '+Math.floor(s.dist)+' ม.';syncStatus();updateVisual();drawRoad();}
 character.src=poses.idle;requestAnimationFrame(frame);
})();
