name: Analyze P1 karaoke word timestamps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-karaoke-align.yml"
      - "scripts/p1_karaoke_whisper.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analyzer
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper

      - name: Analyze all P1 songs directly from repository
        env:
          WHISPER_MODEL: large-v3-turbo
        run: python scripts/p1_karaoke_whisper.py

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add P1/karaoke-whisper-analysis.json
          if git diff --cached --quiet; then
            echo "No analysis changes"
            exit 0
          fi
          git commit -m "P1: analyze karaoke word timestamps from GitHub audio"
          git push origin HEAD:main
