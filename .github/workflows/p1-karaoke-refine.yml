name: Refine P1 karaoke timestamps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-karaoke-refine.yml"
      - "scripts/p1_karaoke_refine.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install faster-whisper
      - name: Refine singing windows from repository audio
        env:
          WHISPER_MODEL: large-v3-turbo
        run: python scripts/p1_karaoke_refine.py
      - name: Commit refined analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add P1/karaoke-whisper-refined.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "P1: refine karaoke timestamps from GitHub audio"
          git push origin HEAD:main
