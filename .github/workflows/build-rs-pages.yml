name: Build ResearchStat GitHub Pages assets

on:
  push:
    branches: [main]
    paths:
      - "rs/components/**"
      - "rs/lib/**"
      - "rs/app/**"
      - "rs/github-pages/**"
      - "rs/effect-size-tab.js"
      - "rs/package.json"
      - "rs/package-lock.json"
      - "rs/vite.github-pages.config.ts"
      - ".github/workflows/build-rs-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages bundle
        run: npm exec vite -- build --config vite.github-pages.config.ts

      - name: Prepare tracked Pages files
        run: |
          sed -i 's#</head>#    <script defer src="/is/rs/save-success-cleanup.js"></script>\n    <script defer src="/is/rs/ioc-default-values.js"></script>\n    <script defer src="/is/rs/effect-size-tab.js?v=20260824"></script>\n  </head>#' github-pages-dist/index.html
          cp github-pages-dist/index.html index.html
          mkdir -p assets
          cp github-pages-dist/assets/* assets/

      - name: Commit generated bundle
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rs/index.html rs/assets
          if git diff --cached --quiet; then
            echo "Bundle is already current."
            exit 0
          fi
          git commit -m "build(rs): publish ResearchStat bundle [skip ci]"
          git push
