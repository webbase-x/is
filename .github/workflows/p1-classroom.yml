name: P1 classroom regression
on:
  pull_request:
    paths: ['P1/**', '.github/workflows/p1-classroom.yml']
  push:
    branches: [main]
    paths: ['P1/**', '.github/workflows/p1-classroom.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --input-type=module --check < P1/js/classroom.js
      - run: npm ci --prefix P1/tests --ignore-scripts
      - run: npm test --prefix P1/tests
